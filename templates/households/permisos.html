{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Permissions" %}{% endblock %}
{% block content %}
<section class="card card--formulario formulario">
  <h1>{% blocktranslate with nombre=membresia.user %}Permissions for {{ nombre }}{% endblocktranslate %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn--primary">{% translate "Save" %}</button>
    <a class="btn btn--sutil" href="{% url 'households:ajustes' %}">{% translate "Cancel" %}</a>
  </form>
</section>
{% endblock %}
