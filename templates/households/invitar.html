{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Invite a member" %}{% endblock %}
{% block content %}
  <h1>{% translate "Invite a member" %}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--primary">{% translate "Send invitation" %}</button>
  </form>
  <p><a href="{% url 'households:ajustes' %}">{% translate "Back to settings" %}</a></p>
{% endblock %}
