{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Record a spend" %} · Wealthome{% endblock %}
{% block content %}
<section class="card">
  <h1>{% translate "Record a spend" %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn--primary" type="submit">{% translate "Save" %}</button>
    <a href="{% url 'budget:mes' %}">{% translate "Cancel" %}</a>
  </form>
</section>
{% endblock %}
