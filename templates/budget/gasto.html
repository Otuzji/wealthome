{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Record a spend" %} · Wealthome{% endblock %}
{% block content %}
<section class="card card--formulario formulario">
  <h1>{% translate "Record a spend" %}</h1>
  <form method="post" x-data="{{ form.x_data|safe }}">
    {% csrf_token %}
    {% include "budget/_fragmentos/campos.html" %}
    <button class="btn btn--primary btn--bloque" type="submit">{% translate "Save" %}</button>
    <a class="btn btn--sutil" href="{% url 'budget:mes' 'household' %}">{% translate "Cancel" %}</a>
  </form>
</section>
{% endblock %}
