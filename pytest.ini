[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
; El pooler de Supabase tarda en crear/destruir la base de datos de pruebas y eso
; ha causado errores de setup espurios (ver Tarea 4). --reuse-db la conserva entre
; corridas: el costo es que, tras añadir una migración, hay que correr una vez con
; --create-db o la base reutilizada se queda con el esquema viejo.
addopts = --reuse-db
